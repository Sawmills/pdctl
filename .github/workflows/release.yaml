name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: pdctl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: pdctl

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Raycast extension
        run: |
          cd raycast-pdctl
          npm ci
          npm run build

      - name: Create tarball
        run: |
          mkdir -p pdctl-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/pdctl pdctl-${{ matrix.target }}/
          cp -r raycast-pdctl pdctl-${{ matrix.target }}/
          rm -rf pdctl-${{ matrix.target }}/raycast-pdctl/node_modules
          tar czf pdctl-${{ matrix.target }}.tar.gz pdctl-${{ matrix.target }}/
          ls -lh pdctl-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdctl-${{ matrix.target }}
          path: pdctl-${{ matrix.target }}.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
