name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Fetch Trunk baseline
        if: hashFiles('.trunk/trunk.yaml') != ''
        id: baseline
        timeout-minutes: 2
        env:
          TRUNK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          base="$TRUNK_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == push &&
            "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
            echo "base=$(git hash-object -w -t tree /dev/null)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          fi
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "::error::Trunk Check requires a valid baseline commit."
            exit 1
          fi
          git fetch --no-tags --no-recurse-submodules --depth=2 origin "$base" "$GITHUB_SHA"
          depth=16
          while ! git merge-base "$base" "$GITHUB_SHA" >/dev/null; do
            if [[ "$(git rev-parse --is-shallow-repository)" != true ]]; then
              echo "::error::Trunk baseline and head have no common Git ancestor."
              exit 1
            fi
            git fetch --no-tags --no-recurse-submodules --deepen="$depth" origin "$base" "$GITHUB_SHA"
            depth=$((depth * 2))
          done
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Cache Trunk tools
        if: hashFiles('.trunk/trunk.yaml') != ''
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/trunk
          key: trunk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.trunk/trunk.yaml') }}

      - name: Install bounded-check timeout
        if: hashFiles('.trunk/trunk.yaml') != ''
        timeout-minutes: 3
        shell: bash
        run: |
          if ! command -v gtimeout >/dev/null; then
            brew install coreutils
          fi

      - name: Set up Trunk
        if: hashFiles('.trunk/trunk.yaml') != ''
        timeout-minutes: 2
        uses: trunk-io/trunk-action/setup@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1

      - name: Trunk Check
        if: hashFiles('.trunk/trunk.yaml') != ''
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUNK_BASE_SHA: ${{ steps.baseline.outputs.base }}
          TRUNK_ALL: ${{ steps.baseline.outputs.all == 'true' }}
          TRUNK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          baseline=(--upstream "$TRUNK_BASE_SHA")
          if [[ "$TRUNK_ALL" == true ]]; then
            baseline=(--all)
          fi
          annotations=("--github-annotate-file=$RUNNER_TEMP/annotations.bin")
          trunk_started=$SECONDS
          if gtimeout --kill-after=5s 590s "$TRUNK_PATH" check --ci \
            "${baseline[@]}" --github-commit "$TRUNK_HEAD_SHA" \
            "${annotations[@]}"; then
            exit 0
          else
            status=$?
            if [[ "$status" == 124 ||
              ( "$status" == 137 && $((SECONDS - trunk_started)) -ge 590 ) ]]; then
              echo "::error::Trunk Check exceeded its 10-minute limit; the check process was terminated."
            elif [[ "$status" == 137 ]]; then
              echo "::error::Trunk Check was forcibly terminated (SIGKILL)."
            fi
            exit "$status"
          fi

      - name: Save Trunk annotations
        if: always() && (hashFiles('.trunk/trunk.yaml') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trunk-annotations
          overwrite: true
          path: ${{ runner.temp }}/annotations.bin

      - name: Trunk failure diagnostics
        if: failure()
        shell: bash
        run: |
          for log in .trunk/logs/cli.log .trunk/logs/daemon.log; do
            if [[ -f "$log" ]]; then
              echo "::group::$log (last 200 lines)"
              tail -n 200 "$log"
              echo "::endgroup::"
            fi
          done
