name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch Trunk baseline
        if: hashFiles('.trunk/trunk.yaml') != ''
        id: baseline
        timeout-minutes: 2
        env:
          TRUNK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          base="$TRUNK_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          fi
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "::error::Trunk Check requires a valid baseline commit."
            exit 1
          fi
          history=()
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            history=(--unshallow)
          fi
          git fetch --no-tags --no-recurse-submodules "${history[@]}" origin "$base" "$GITHUB_SHA"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Cache Trunk tools
        if: hashFiles('.trunk/trunk.yaml') != ''
        uses: actions/cache@v5
        with:
          path: ~/.cache/trunk
          key: trunk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.trunk/trunk.yaml') }}

      - name: Install bounded-check timeout
        if: hashFiles('.trunk/trunk.yaml') != ''
        timeout-minutes: 3
        shell: bash
        run: |
          if ! command -v gtimeout >/dev/null; then
            brew install coreutils
          fi

      - name: Set up Trunk
        if: hashFiles('.trunk/trunk.yaml') != ''
        timeout-minutes: 2
        uses: trunk-io/trunk-action/setup@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1

      - name: Trunk Check
        if: hashFiles('.trunk/trunk.yaml') != ''
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUNK_BASE_SHA: ${{ steps.baseline.outputs.base }}
          TRUNK_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          TRUNK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          annotations=(--github-annotate)
          if [[ "$TRUNK_FORK" == true ]]; then
            annotations=("--github-annotate-file=$RUNNER_TEMP/annotations.bin")
          fi
          if gtimeout --kill-after=5s 590s "$TRUNK_PATH" check --ci \
            --upstream "$TRUNK_BASE_SHA" --github-commit "$TRUNK_HEAD_SHA" \
            "${annotations[@]}"; then
            exit 0
          else
            status=$?
            if [[ "$status" == 124 || "$status" == 137 ]]; then
              echo "::error::Trunk Check exceeded its 10-minute limit; the check process was terminated."
            fi
            exit "$status"
          fi

      - name: Save fork annotations
        if: always() && (hashFiles('.trunk/trunk.yaml') != '') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trunk-annotations
          overwrite: true
          path: ${{ runner.temp }}/annotations.bin

      - name: Trunk failure diagnostics
        if: failure()
        shell: bash
        run: |
          for log in .trunk/logs/cli.log .trunk/logs/daemon.log; do
            if [[ -f "$log" ]]; then
              echo "::group::$log (last 200 lines)"
              tail -n 200 "$log"
              echo "::endgroup::"
            fi
          done
